<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de imagem</title>
    <link rel="stylesheet" href="style.css">
    

</head>
<body>
 <div class="container" style="--pos: 50%;">
  <input type="range" min="0" max="100" value="50" class="slider" oninput="this.parentElement.style.setProperty('--pos', this.value + '%')">
  <img src="before.jpg" alt="Before" class="img-before">
  <img src="after.jpg" alt="After" class="img-after">
</div>
</body>
</html>
