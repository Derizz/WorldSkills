<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de imagem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="file" id="fileInput" multiple accept="image/*"> 
    <div id="dropZone" style="border: 2px dashed #ccc; padding: 100px; margin-top: 10px;">
        Arraste e solte imagens aqui ou clique para selecionar arquivos.
    </div>
    <button id="sampleBtn">Carregar fotos de amostra</button>
    <ul id="galleryList"></ul>
    <script src="script.js"></script>
</body>
</html>
