<!DOCTYPE html>
<html lang="pt-BR"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinner de Loading</title>
    <style>
        
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #e0e0e0;
            border-top: 6px solid #007bff;
            border-radius: 50%;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .contudo-pesado img {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
            display: block;
        }

    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div class="conteudo-pesado">
        <h1>Mini-projeto A6: Página com Carregamento Simulado</h1>
        <p>Esta página foi propositalmente tornada pesada com imagem em alta resolução para que o carregamento demore o suficiente e você testa o spinner as ferramentas do desenvolvedor (DevTools).</p>
        <img src="https://picsum.photos/id/1015/1920/1080" alt="imagem de alta resolução para teste de carregamento 1">
        <img src="https://picsum.photos/id/1016/1920/1080" alt="imagem de alta resolução para teste de carregamento 2">
        <img src="https://picsum.photos/id/1018/1920/1080" alt="imagem de alta resolução para teste de carregamento 3">

    </div>

    <script>
        window.addEventListener('load', function() {
            const loadingOverlay = document.getElementById('loading-overlay');
            Overlay.style.opacity = '0';
            setTimeout(() => {
                Overlay.style.display = 'none';
            }, 500); // Aguarda a transição de opacidade antes de ocultar o overlay
        });
    </script>
    <script>
        window.addEventListener('load', () => {
            const overlay = document.getElementById('loading-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500);
        });
    </script>
    <h1>Mini-projeto A6</h1>
    <p>Em breve o conteúdo estara completo</p>
</body>
</html>
